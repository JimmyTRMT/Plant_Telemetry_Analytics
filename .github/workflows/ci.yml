name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=src/telemetry_pipeline --cov-fail-under=80

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Static analysis of the Python code
        run: bandit -c pyproject.toml -r src
      - name: Known vulnerabilities in dependencies
        run: pip-audit --skip-editable
      - name: Workflow hardening
        run: zizmor --offline .github

  pipeline:
    name: Pipeline on a fixed window
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Simulate, ingest, run dbt models and tests
        run: telemetry run --days 21 --end-date 2026-03-31 --docs
      - name: Build the dashboard
        run: telemetry dashboard --output site
