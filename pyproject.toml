[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-telemetry-analytics"
version = "0.1.0"
description = "Analytics engineering project: industrial plant telemetry from raw sensor readings to a published dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jimmy Tremouillault" }]
dependencies = [
    "duckdb>=1.1,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9,<2",
    "jinja2>=3.1",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "zizmor>=1.0",
    "pre-commit>=3.7",
]

[project.scripts]
telemetry = "telemetry_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telemetry_pipeline = ["dashboard/templates/*.j2", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "N", "S", "PTH", "DTZ", "RUF", "PERF"]

[tool.ruff.lint.per-file-ignores]
# Embedded SQL reads better on long lines.
"src/telemetry_pipeline/dashboard/data.py" = ["E501"]
# Tests assert by design, and the warehouse stores local timestamps without a zone.
"tests/*" = ["S101", "DTZ001"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests"]
